aid: craon
name: Craon
description: Craon (craon.ai) is an AI-native video editing platform where users edit through
  natural-language chat instead of a traditional timeline. Creators describe their intent in plain
  language — "make this more cinematic", "build tension before the reveal", "warm golden-hour grade" —
  and Craon's AI performs the cuts, color grading, pacing, silence removal, scene detection, subtitle
  generation, and emotional storytelling automatically. It targets content creators, YouTubers, social
  and short-form creators, filmmakers, and marketing teams who want professional results without
  timeline experience or color-theory skills, positioning itself as an AI-native alternative to CapCut,
  Adobe Premiere Pro, DaVinci Resolve, iMovie, Filmora, Runway, and Descript. Craon is an early-stage
  company surfaced as a portfolio company of 500 Global and added to the API Evangelist network. The
  product is a consumer web application with no public developer API; its only machine-facing surface
  today is a published /llms.txt for AI discovery.
